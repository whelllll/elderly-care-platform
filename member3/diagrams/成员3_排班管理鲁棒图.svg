<text x="1950.0" y="816.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="black">排班信息</text>
<text x="1950.0" y="867.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="black">caregiver_schedule</text>
<text x="315.0" y="270.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">1 维护请求 / 操作结果</text>
<text x="795.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">2 提交创建或修改请求</text>
<text x="1300.0" y="620.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">4 时间有效性及冲突校验</text>
<text x="1530.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">3 核对护工存在</text>
<text x="1560.0" y="760.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">5 查询未取消的排班</text>
<text x="1640.0" y="610.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">6 通过后保存</text>
<text x="630.0" y="1060.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">7 返回成功或拒绝原因</text>
<text x="1200.0" y="1170.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="black">校验与保存处于同一事务；失败不保存。创建、修改、恢复排班均检查重叠，修改时排除自身。</text>
<text x="1200.0" y="1240.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="black">结束时间 &gt; 开始时间；同一护工未取消区间不得重叠，采用 [开始, 结束)，允许首尾衔接。</text>
<text x="1200.0" y="1310.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="black">取消排班也应遵守已有派单关联的变更保护规则；本图聚焦排班维护，不展开成员2派单流程。</text>
<text x="1200.0" y="1390.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="black">«boundary» 接收与展示　 «control» 组织规则与事务　 «entity» 读取或保存业务数据</text>
</svg>