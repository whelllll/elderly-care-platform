<text x="340.0" y="270.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">1 签到或签退</text>
<text x="830.0" y="330.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">2 提交时间与位置</text>
<text x="1750.0" y="270.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">3 核对已接单有效派单</text>
<text x="1750.0" y="510.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">班次及护工一致</text>
<text x="900.0" y="590.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">4 请求定位校验与核算</text>
<text x="1760.0" y="720.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">5 读取地点、坐标和半径</text>
<text x="1780.0" y="940.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">6 保存签到签退及原围栏结果</text>
<text x="900.0" y="930.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">7 签退后：常规审核 / 异常人工核实</text>
<text x="340.0" y="990.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">8 查看待审核记录并核实</text>
<text x="830.0" y="1000.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">9 提交审核决定、认可分钟及说明</text>
<text x="1770.0" y="1070.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">10 读取记录并保存审核结果</text>
<text x="830.0" y="1370.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">11 请求个人有效工时</text>
<text x="1800.0" y="1390.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">12 仅汇总审核通过且工时明确的记录</text>
<text x="1300.0" y="1580.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="black">签到前：有效派单已接单；work_record.schedule_id = dispatch_record.schedule_id，且班次护工一致。</text>
<text x="1300.0" y="1650.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="black">围栏通过进入常规审核；定位缺失、越界或格式异常进入人工审核。异常通过须保留 review_note，原 fence_result 不改为“通过”。</text>
<text x="1300.0" y="1720.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="black">每派单最多一条工时；签退晚于签到；认可分钟非负且不超过实际时长；待审核或驳回的有效工时为空。</text>
<text x="1300.0" y="1790.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="black">统计条件：review_status＝“通过”且 effective_minutes 非空；按签到月份归属，跨月不拆分。订单状态由成员2接口协调。</text>
