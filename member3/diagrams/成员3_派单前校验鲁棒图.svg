<text x="1920.0" y="490.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">项目资质、状态和有效期</text>
<text x="1920.0" y="710.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">开放、护工一致、时段覆盖</text>
<text x="1920.0" y="910.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">服务项目上架状态</text>
<text x="1470.0" y="1190.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">按 schedule_id 查容量及有效派单冲突</text>
<text x="650.0" y="920.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="black">6 全部通过后写入 schedule_id</text>
<text x="1220.0" y="1280.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="black">同一事务：读取加锁 → 成员3校验 → 成员2写入 → 一次提交；任一失败整体回滚。</text>
<text x="1300.0" y="1440.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="black">容量按 dispatch_record.schedule_id 直接归班次：待接单、已接单占用；拒绝、撤回释放；完成仍累计。</text>
<text x="1300.0" y="1510.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="black">服务区间使用预约开始 + duration_minutes；须完整位于所选班次内，班次护工须等于派单护工。</text>
<text x="1300.0" y="1580.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="black">按护工检查有效派单服务区间冲突；成员3仅提供校验，不另行创建或提交成员2派单。</text>
